<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Complaint Manager</title>

<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>

.page{
    width:95%;
    max-width:1400px;
    margin:40px auto;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.header button{
    width:auto;
    padding:12px 24px;
}

.controls{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:25px;
}

.controls input,
.controls select{
    width:220px;
}

.table-card{

    background:white;

    padding:25px;

    border-radius:18px;

    box-shadow:0 10px 25px rgba(0,0,0,.12);

}

table{

    width:100%;

    border-collapse:collapse;

}

th{

    background:#2563eb;

    color:white;

    padding:14px;

}

td{

    padding:14px;

    border-bottom:1px solid #eee;

}

tr:hover{

    background:#f8faff;

}

.status{

    color:white;

    padding:7px 14px;

    border-radius:20px;

    font-size:14px;

    font-weight:bold;

}

.pending{

    background:#f59e0b;

}

.progress{

    background:#3b82f6;

}

.resolved{

    background:#16a34a;

}

.update-select{

    width:170px;

}

</style>

</head>

<body>

<div class="page">

<div class="header">

<h1 style="color:#2563eb">

📋 Complaint Manager

</h1>

<button onclick="location.href='admin-dashboard.html'">

Dashboard

</button>

</div>

<div class="controls">

<input

type="text"

id="search"

placeholder="Search complaint...">

<select id="statusFilter">

<option value="All">All Status</option>

<option>Pending</option>

<option>In Progress</option>

<option>Resolved</option>

</select>

<select id="categoryFilter">

<option value="All">All Categories</option>

<option>Electric</option>

<option>Road</option>

<option>Water</option>

<option>Internet</option>

</select>

</div>

<div class="table-card">

<table>

<thead>

<tr>

<th>Name</th>

<th>Email</th>

<th>Category</th>

<th>Subject</th>

<th>Status</th>

<th>Update</th>

</tr>

</thead>

<tbody id="complaintsTable">

</tbody>

</table>

</div>

</div>

<footer>

© 2026 Smart Complaint Management System | Developed by Jitendra

</footer>

<script>
const BASE_URL = "https://scs-m5an.onrender.com/api";

const token = localStorage.getItem("token");

if (!token) {
    window.location.href = "admin-login.html";
}

let complaints = [];

async function loadComplaints() {
    try {
        const res = await fetch(`${BASE_URL}/complaints`, {
            headers: {
                Authorization: "Bearer " + token
            }
        });

        const data = await res.json();

        console.log("Complaints from server:", data);

        if (!res.ok) {
            console.error("Failed to load complaints:", data.message);
            return;
        }

        complaints = data;

        renderTable();

    } catch (error) {
        console.error("Error loading complaints:", error);
        Swal.fire({
            icon: "error",
            title: "Error",
            text: "Could not load complaints from server"
        });
    }
}

function badge(status) {
    if (status === "Pending")
        return '<span class="status pending">Pending</span>';

    if (status === "In Progress")
        return '<span class="status progress">In Progress</span>';

    return '<span class="status resolved">Resolved</span>';
}

function renderTable() {
    const search = document.getElementById("search").value.toLowerCase();

    const status = document.getElementById("statusFilter").value;

    const category = document.getElementById("categoryFilter").value;

    let rows = "";

    complaints
        .filter(c => {

            const matchSearch =
                c.name.toLowerCase().includes(search) ||
                c.email.toLowerCase().includes(search) ||
                c.subject.toLowerCase().includes(search) ||
                c.category.toLowerCase().includes(search);

            const matchStatus =
                status === "All" || c.status === status;

            const matchCategory =
                category === "All" ||
                c.category.toLowerCase() === category.toLowerCase();

            return matchSearch && matchStatus && matchCategory;

        })
        .forEach(c => {

            rows += `
                <tr>
                    <td>${c.name}</td>
                    <td>${c.email}</td>
                    <td>${c.category}</td>
                    <td>${c.subject}</td>
                    <td>${badge(c.status)}</td>
                    <td>
                        <select
                            class="update-select"
                            onchange="updateStatus('${c._id}', this.value)"
                        >
                            <option ${c.status === "Pending" ? "selected" : ""}>
                                Pending
                            </option>

                            <option ${c.status === "In Progress" ? "selected" : ""}>
                                In Progress
                            </option>

                            <option ${c.status === "Resolved" ? "selected" : ""}>
                                Resolved
                            </option>
                        </select>
                    </td>
                </tr>
            `;

        });

    document.getElementById("complaintsTable").innerHTML = rows;
}

async function updateStatus(id, status) {
    try {
        const res = await fetch(`${BASE_URL}/complaints/${id}`, {
            method: "PUT",

            headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer " + token
            },

            body: JSON.stringify({
                status
            })
        });

        const data = await res.json();

        if (!res.ok) {
            Swal.fire({
                icon: "error",
                title: "Update Failed",
                text: data.message || "Could not update complaint"
            });

            return;
        }

        Swal.fire({
            icon: "success",
            title: "Updated",
            text: "Complaint status updated successfully",
            timer: 1200,
            showConfirmButton: false
        });

        loadComplaints();

    } catch (error) {
        console.error(error);
    }
}

document.getElementById("search")
    .addEventListener("keyup", renderTable);

document.getElementById("statusFilter")
    .addEventListener("change", renderTable);

document.getElementById("categoryFilter")
    .addEventListener("change", renderTable);

loadComplaints();
</script>

</body>

</html>
