<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Submit Complaint</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>

        .page {
            max-width: 800px;
            margin: 40px auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,.12);
        }

        .back-btn {
            width: auto;
            padding: 12px 25px;
        }

    </style>
</head>


<body>

    <div class="page">

        <div class="header">

            <h1 style="color:#2563eb;">
                📝 Submit Complaint
            </h1>

            <button
                class="back-btn"
                onclick="location.href='dashboard.html'">
                Dashboard
            </button>

        </div>


        <div class="form-card">

            <form id="complaintForm">

                <input
                    type="text"
                    id="name"
                    placeholder="Full Name"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required
                >

                <input
                    type="text"
                    id="category"
                    placeholder="Complaint Category"
                    required
                >

                <input
                    type="text"
                    id="subject"
                    placeholder="Complaint Subject"
                    required
                >

                <textarea
                    id="description"
                    placeholder="Describe your complaint..."
                    required
                ></textarea>

                <button type="submit">
                    Submit Complaint
                </button>

            </form>

        </div>

    </div>


    <script>

        // ==========================================
        // BACKEND API URL
        // ==========================================
        const BASE_URL = "https://scs-m5an.onrender.com/api";


        // ==========================================
        // CHECK LOGIN
        // ==========================================
        const token = localStorage.getItem("token");

        if (!token) {
            window.location.href = "login.html";
        }


        // ==========================================
        // AUTO-FILL USER DETAILS
        // ==========================================
        const storedUser = localStorage.getItem("user");

        if (storedUser) {

            const user = JSON.parse(storedUser);

            document.getElementById("name").value =
                user.fullName || "";

            document.getElementById("email").value =
                user.email || "";

        }


        // ==========================================
        // SUBMIT COMPLAINT
        // ==========================================
        document
            .getElementById("complaintForm")
            .addEventListener("submit", async (e) => {

                e.preventDefault();

                try {

                    const response = await fetch(
                        `${BASE_URL}/complaints`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json",
                                "Authorization": "Bearer " + token
                            },

                            body: JSON.stringify({

                                category:
                                    document.getElementById("category").value,

                                subject:
                                    document.getElementById("subject").value,

                                description:
                                    document.getElementById("description").value
                            })
                        }
                    );


                    const data = await response.json();


                    if (response.ok) {

                        Swal.fire({
                            icon: "success",
                            title: "Complaint Submitted!",
                            text: data.message,
                            timer: 1800,
                            showConfirmButton: false
                        });


                        document
                            .getElementById("complaintForm")
                            .reset();


                        // Put user details back after reset
                        if (storedUser) {

                            const user = JSON.parse(storedUser);

                            document.getElementById("name").value =
                                user.fullName || "";

                            document.getElementById("email").value =
                                user.email || "";
                        }

                    } else {

                        Swal.fire({
                            icon: "error",
                            title: "Complaint Failed",
                            text: data.message || "Unable to submit complaint"
                        });

                    }

                } catch (error) {

                    console.error("Complaint submission error:", error);

                    Swal.fire({
                        icon: "error",
                        title: "Server Error",
                        text: error.message
                    });

                }

            });

    </script>


    <footer>

        © 2026 Smart Complaint Management System

        Developed by Jitendra

    </footer>

</body>
</html>
