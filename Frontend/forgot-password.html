<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            flex-direction: column;

            background: #e8edf8;
        }

        main {
            flex: 1;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .card {
            width: 100%;
            max-width: 450px;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.15);

            text-align: center;
        }

        h1 {
            color: #294b88;
            margin-bottom: 15px;
            font-size: 28px;
        }

        p {
            color: #333;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        input {
            width: 100%;

            padding: 15px;

            margin-bottom: 15px;

            border: 1px solid #ccc;

            border-radius: 10px;

            font-size: 16px;
        }

        button {
            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 10px;

            background: #315fc1;

            color: white;

            font-size: 17px;

            cursor: pointer;

            margin-bottom: 15px;
        }

        button:hover {
            opacity: 0.9;
        }

        .hidden {
            display: none;
        }

        .message {
            margin-top: 10px;
            font-weight: bold;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        a {
            color: #294b88;
            font-weight: bold;
            text-decoration: none;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #444;
        }

    </style>

</head>


<body>


<main>

    <div class="card">


        <!-- STEP 1 -->

        <div id="emailSection">

            <h1>Forgot Password</h1>

            <p>
                Enter your registered email address.
                We will send you a 6-digit password reset code.
            </p>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
            >

            <button onclick="sendResetCode()">
                Send Reset Code
            </button>

        </div>


        <!-- STEP 2 -->

        <div
            id="resetSection"
            class="hidden"
        >

            <h1>Reset Password</h1>

            <p>
                Enter the 6-digit code sent to your email
                and create a new password.
            </p>

            <input
                type="text"
                id="resetCode"
                placeholder="Enter 6-digit code"
                maxlength="6"
            >

            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
            >

            <button onclick="resetPassword()">
                Reset Password
            </button>

        </div>


        <p
            id="message"
            class="message"
        ></p>


        <p style="margin-top: 20px;">
            <a href="login.html">
                Back to Login
            </a>
        </p>


    </div>

</main>


<footer>
    © 2026 Smart Complaint Management System
    <br>
    Developed by Jitendra
</footer>


<script>


// ===================================================
// VERY IMPORTANT
// PUT YOUR ACTUAL RENDER BACKEND URL HERE
// ===================================================

const API_URL =
    "https://scs-m5an.onrender.com/api/auth";


// Stores the email while resetting password

let userEmail = "";


// ===================================================
// SEND RESET CODE
// ===================================================

async function sendResetCode() {

    const email =
        document.getElementById("email").value.trim();

    const message =
        document.getElementById("message");


    if (!email) {

        message.textContent =
            "Please enter your email address";

        message.className =
            "message error";

        return;
    }


    message.textContent =
        "Sending reset code...";

    message.className =
        "message";


    try {

        const response =
            await fetch(
                `${API_URL}/forgot-password`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",
                    },

                    body: JSON.stringify({
                        email: email,
                    }),
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to send reset code"
            );
        }


        userEmail = email;


        message.textContent =
            "Reset code sent! Check your Inbox or Spam folder.";

        message.className =
            "message success";


        document
            .getElementById("emailSection")
            .classList
            .add("hidden");


        document
            .getElementById("resetSection")
            .classList
            .remove("hidden");


    } catch (error) {

        console.error(error);


        message.textContent =
            error.message;


        message.className =
            "message error";
    }
}


// ===================================================
// RESET PASSWORD
// ===================================================

async function resetPassword() {

    const code =
        document
            .getElementById("resetCode")
            .value
            .trim();


    const newPassword =
        document
            .getElementById("newPassword")
            .value;


    const message =
        document.getElementById("message");


    if (!code || !newPassword) {

        message.textContent =
            "Please enter the reset code and new password";

        message.className =
            "message error";

        return;
    }


    if (code.length !== 6) {

        message.textContent =
            "Please enter a valid 6-digit code";

        message.className =
            "message error";

        return;
    }


    if (newPassword.length < 6) {

        message.textContent =
            "Password must contain at least 6 characters";

        message.className =
            "message error";

        return;
    }


    message.textContent =
        "Resetting password...";

    message.className =
        "message";


    try {

        const response =
            await fetch(
                `${API_URL}/reset-password`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",
                    },

                    body: JSON.stringify({
                        email: userEmail,
                        code: code,
                        newPassword: newPassword,
                    }),
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to reset password"
            );
        }


        message.textContent =
            "Password reset successful! Redirecting to login...";

        message.className =
            "message success";


        setTimeout(() => {

            window.location.href =
                "login.html";

        }, 2000);


    } catch (error) {

        console.error(error);


        message.textContent =
            error.message;


        message.className =
            "message error";
    }
}


</script>


</body>

</html>
