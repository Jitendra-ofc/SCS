<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .dashboard {
            width: 95%;
            max-width: 1300px;
            margin: 40px auto;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        .logout-btn {
            width: auto;
            padding: 12px 25px;
            background: #ef4444;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 35px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .12);
        }

        .stat-card h2 {
            font-size: 35px;
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 18px;
            font-weight: bold;
        }

        .cards {
            display: grid;
            grid-template-columns: 1fr;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .12);
        }

        .card button {
            width: 240px;
        }

        .total {
            color: #2563eb;
        }

        .pending {
            color: #f59e0b;
        }

        .progress {
            color: #3b82f6;
        }

        .resolved {
            color: #16a34a;
        }

        @media (max-width: 800px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .stats {
                grid-template-columns: 1fr;
            }
        }

    </style>

</head>

<body>

    <div class="dashboard">

        <div class="dashboard-header">

            <div>
                <h1>🛡️ Admin Dashboard</h1>
                <p>Manage all complaints efficiently.</p>
            </div>

            <button class="logout-btn" onclick="logout()">
                Logout
            </button>

        </div>


        <div class="stats">

            <div class="stat-card">
                <h2 class="total" id="total">0</h2>
                <p>Total Complaints</p>
            </div>

            <div class="stat-card">
                <h2 class="pending" id="pending">0</h2>
                <p>Pending</p>
            </div>

            <div class="stat-card">
                <h2 class="progress" id="progress">0</h2>
                <p>In Progress</p>
            </div>

            <div class="stat-card">
                <h2 class="resolved" id="resolved">0</h2>
                <p>Resolved</p>
            </div>

        </div>


        <div class="cards">

            <div class="card">

                <h2>📋 Complaint Management</h2>

                <p>
                    View, search, filter and update complaint status.
                </p>

                <button onclick="location.href='admin-complaints.html'">
                    Open Complaint Manager
                </button>

            </div>

        </div>

    </div>


    <footer>
        © 2026 Smart Complaint Management System | Developed by Jitendra
    </footer>


    <script>

        const token = localStorage.getItem("token");

        // Your deployed Render backend API
        const API_URL = "https://scs-m5an.onrender.com/api/complaints/stats";


        async function loadStats() {

            try {

                if (!token) {
                    console.error("No admin token found");

                    window.location.href = "admin-login.html";
                    return;
                }


                const res = await fetch(API_URL, {

                    method: "GET",

                    headers: {
                        Authorization: "Bearer " + token
                    }

                });


                if (!res.ok) {

                    console.error("Failed to load stats. Status:", res.status);

                    throw new Error("Failed to load dashboard statistics");

                }


                const data = await res.json();

                console.log("Dashboard stats:", data);


                document.getElementById("total").innerText =
                    data.total || 0;

                document.getElementById("pending").innerText =
                    data.pending || 0;

                document.getElementById("progress").innerText =
                    data.progress || 0;

                document.getElementById("resolved").innerText =
                    data.resolved || 0;


            } catch (err) {

                console.error("Dashboard stats error:", err);

                // Keep dashboard values at 0 if API fails
                document.getElementById("total").innerText = 0;
                document.getElementById("pending").innerText = 0;
                document.getElementById("progress").innerText = 0;
                document.getElementById("resolved").innerText = 0;

            }

        }


        loadStats();


        function logout() {

            localStorage.clear();

            window.location.href = "admin-login.html";

        }

    </script>

</body>

</html>
