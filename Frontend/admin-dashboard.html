<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<link rel="stylesheet" href="style.css">

<style>

.dashboard{
    width:95%;
    max-width:1300px;
    margin:40px auto;
}

.dashboard-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:35px;
}

.logout-btn{
    width:auto;
    padding:12px 25px;
    background:#ef4444;
}

.logout-btn:hover{
    background:#dc2626;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin-bottom:35px;
}

.stat-card{
    background:white;
    padding:25px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,.12);
}

.stat-card h2{
    font-size:35px;
    margin-bottom:10px;
}

.stat-card p{
    font-size:18px;
    font-weight:bold;
}

.cards{
    display:grid;
    grid-template-columns:1fr;
}

.card{
    background:white;
    padding:35px;
    border-radius:18px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,.12);
}

.card button{
    width:240px;
}

.total{color:#2563eb;}
.pending{color:#f59e0b;}
.progress{color:#3b82f6;}
.resolved{color:#16a34a;}

</style>

</head>

<body>

<div class="dashboard">

<div class="dashboard-header">

<div>

<h1>🛡️ Admin Dashboard</h1>

<p>Manage all complaints efficiently.</p>

</div>

<button class="logout-btn" onclick="logout()">
Logout
</button>

</div>

<div class="stats">

<div class="stat-card">
<h2 class="total" id="total">0</h2>
<p>Total Complaints</p>
</div>

<div class="stat-card">
<h2 class="pending" id="pending">0</h2>
<p>Pending</p>
</div>

<div class="stat-card">
<h2 class="progress" id="progress">0</h2>
<p>In Progress</p>
</div>

<div class="stat-card">
<h2 class="resolved" id="resolved">0</h2>
<p>Resolved</p>
</div>

</div>

<div class="cards">

<div class="card">

<h2>📋 Complaint Management</h2>

<p>
View, search, filter and update complaint status.
</p>

<button onclick="location.href='admin-complaints.html'">
Open Complaint Manager
</button>

</div>

</div>

</div>

<script>

const token = localStorage.getItem("token");

async function loadStats(){

const res = await fetch("http://localhost:5000/api/complaints/stats",{

headers:{
Authorization:"Bearer "+token
}

});

const data = await res.json();

document.getElementById("total").innerText=data.total;
document.getElementById("pending").innerText=data.pending;
document.getElementById("progress").innerText=data.progress;
document.getElementById("resolved").innerText=data.resolved;

}

loadStats();

function logout(){

localStorage.clear();

location.href="admin-login.html";

}

</script>

<footer>

© 2026 Smart Complaint Management System | Developed by Jitendra

</footer>

</body>

</html>
