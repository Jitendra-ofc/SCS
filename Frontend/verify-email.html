<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify Email</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>

<body class="auth-page">

    <div class="container">

        <h2>📧 Verify Your Email</h2>

        <p style="margin-bottom: 20px;">
            Enter your email address and the 6-digit verification code
            sent to your Gmail.
        </p>

        <form id="verifyEmailForm">

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <input
                type="text"
                id="code"
                placeholder="6-Digit Verification Code"
                maxlength="6"
                required
            >

            <button type="submit">
                Verify Email
            </button>

        </form>

        <p style="margin-top: 20px;">
            Didn't receive a code?
            <a href="resend-verification.html">
                Resend Verification Code
            </a>
        </p>

        <p>
            <a href="login.html">Back to Login</a>
        </p>

    </div>

    <script>
        // Automatically fill the email used during registration
        const verificationEmail = localStorage.getItem("verificationEmail");

        if (verificationEmail) {
            document.getElementById("email").value = verificationEmail;
        }
    </script>

    <script src="script.js"></script>

    <footer>
        © 2026 Smart Complaint Management System
        <br>
        Developed by Jitendra
    </footer>

</body>

</html>
